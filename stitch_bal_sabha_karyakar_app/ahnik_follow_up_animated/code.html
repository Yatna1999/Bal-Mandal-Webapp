<script>
        // Simple script to handle toggling the ledger rows for demonstration
        document.querySelectorAll('main > div').forEach(row => {
            row.addEventListener('click', function() {
                const circleContainer = this.querySelector('.w-\\[28px\\]');
                const circle = circleContainer.firstElementChild;
                
                // Reset animation to allow re-triggering
                circle.classList.remove('pop');
                void circle.offsetWidth; // trigger reflow
                
                if(circle.classList.contains('border-outline')) {
                    // Turn to Done
                    circle.className = 'w-[24px] h-[24px] rounded-full bg-primary-container flex items-center justify-center pop';
                    circle.innerHTML = '<span class="material-symbols-outlined text-on-primary" style="font-size: 16px;">check</span>';
                } else {
                    // Turn to Not Done
                    circle.className = 'w-[24px] h-[24px] rounded-full border-[1.5px] border-outline pop';
                    circle.innerHTML = '';
                }
            });
        });
    </script>
